<!doctype html>
<html lang="zh-Hans">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-LVJJ4GY9FC"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-LVJJ4GY9FC');
  </script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Class Manager</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script>window.Auth.requireLogin();</script>
</head>
<body>
  <div class="wip-banner" role="alert">⚠施工中，请勿使用 Work in Progress. Do NOT use.</div>
  <header class="top">
    <div class="brand">
      <img class="logo" src="favicon.svg" alt="" width="32" height="32">
      <div><b id="brandName">Class Manager</b><small id="brandSub"></small></div>
    </div>
    <input id="classTitle" class="class-title" maxlength="60" autocomplete="off">
    <div class="cloudbar">
      <select id="classSel" aria-label="Class"></select>
      <span id="syncStatus" class="sync" role="status"></span>
    </div>
    <div class="tools">
      <a id="lnkView" class="navbtn" href="index.html">👁 <span></span></a>
      <button id="btnUndo" class="icon" aria-label="Undo">↶</button>
      <button id="btnRedo" class="icon" aria-label="Redo">↷</button>
      <button id="btnNew"><span></span></button>
      <button id="btnOpen"><span></span></button>
      <button id="btnSave"><span></span></button>
      <button id="btnPrint"><span></span></button>
      <select id="langSel" aria-label="Language">
        <option value="en">English</option>
        <option value="zh">中文</option>
        <option value="ms">Bahasa Melayu</option>
        <option value="ta">தமிழ்</option>
      </select>
      <button id="btnZip" class="zipbtn" type="button">⬇ <span></span></button>
      <button id="btnSignOut" type="button">👤 <span></span></button>
      <input type="file" id="openFile" accept=".json,application/json" hidden>
    </div>

  </header>

  <main>
    <aside class="panel">
      <nav class="tabs">
        <button class="tab" data-tab="layout"><b>1</b><span></span></button>
        <button class="tab" data-tab="roster"><b>2</b><span></span></button>
        <button class="tab" data-tab="assign"><b>3</b><span></span></button>
        <button class="tab" data-tab="roles"><b>4</b><span></span></button>
        <button class="tab" data-tab="points"><b>5</b><span></span></button>
      </nav>
      <div id="side" class="side"></div>
      <footer id="footNote" class="foot"></footer>
    </aside>

    <section class="stage-wrap">
      <h1 id="printTitle" class="print-title"></h1>
      <div id="stage" class="stage">
        <div id="sizer" class="sizer"><div id="board" class="board"></div></div>
      </div>
      <div class="zoom">
        <button id="zoomOut" class="icon" aria-label="Zoom out">−</button>
        <span id="zoomVal">100%</span>
        <button id="zoomIn" class="icon" aria-label="Zoom in">+</button>
        <button id="zoomFit"></button>
      </div>
    </section>
  </main>

  <div id="offlineModal" class="mdo" hidden>
    <div class="mdc" role="dialog" aria-modal="true" aria-labelledby="offlineTitle">
      <div class="mdicon" aria-hidden="true">💻</div>
      <h3 id="offlineTitle"></h3>
      <p id="offlineMsg"></p>
      <ol id="offlineSteps"></ol>
      <div class="mdbtns">
        <a id="offlineDownload" class="mdbtn primary" href="https://github.com/MrWengKB/ClassManager/archive/refs/heads/main.zip" download>⬇ <span></span></a>
        <button id="offlineClose" class="mdbtn" type="button"></button>
      </div>
    </div>
  </div>

  <script src="js/i18n.js"></script>
  <script src="js/points.js"></script>
  <script src="js/store.js"></script>
  <script src="js/roster.js"></script>
  <script src="js/seating.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/app.js"></script>
  <script src="js/cloud.js"></script>
  <script src="js/sync.js"></script>
</body>
</html>
