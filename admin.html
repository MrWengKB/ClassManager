<!doctype html>
<html lang="zh-Hans">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-LVJJ4GY9FC"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-LVJJ4GY9FC');
  </script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Class Manager</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/maskable-192.png">
  <meta name="theme-color" content="#4a5a4b">
  <link rel="stylesheet" href="style.css?v=20261124a">
  <script src="js/mobile.js?v=20261122i"></script>
  <script src="js/config.js?v=20261123b"></script>
  <script src="js/auth.js?v=20261122i"></script>
  <script>window.Auth.requireLogin();</script>
</head>
<body>
  <header class="top">
    <div class="brand">
      <img class="logo" src="favicon.svg" alt="" width="32" height="32">
      <div><b id="brandName">Class Manager</b><small id="brandSub"></small></div>
    </div>
    <input id="classTitle" class="class-title" maxlength="60" autocomplete="off">
    <div class="cloudbar">
      <select id="classSel" aria-label="Class"></select>
      <span id="syncStatus" class="sync" role="status"></span>
    </div>
    <div class="tools">
      <a id="lnkView" class="navbtn" href="index.html">👁 <span></span></a>
      <button id="btnUndo" class="icon" aria-label="Undo">↶</button>
      <button id="btnRedo" class="icon" aria-label="Redo">↷</button>
      <button id="btnNew"><span></span></button>
      <button id="btnOpen"><span></span></button>
      <button id="btnSave"><span></span></button>
      <button id="btnPrint"><span></span></button>
      <select id="langSel" aria-label="Language">
        <option value="en">English</option>
        <option value="zh">中文</option>
        <option value="ms">Bahasa Melayu</option>
        <option value="ta">தமிழ்</option>
      </select>
      <button id="btnZip" class="zipbtn" type="button">⬇ <span></span></button>
      <button id="btnSignOut" type="button">👤 <span></span></button>
      <input type="file" id="openFile" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" hidden>
    </div>

  </header>

  <main>
    <aside class="panel">
      <nav class="tabs">
        <button class="tab" data-tab="layout"><b>1</b><span></span></button>
        <button class="tab" data-tab="roster"><b>2</b><span></span></button>
        <button class="tab" data-tab="assign"><b>3</b><span></span></button>
        <button class="tab" data-tab="roles"><b>4</b><span></span></button>
        <button class="tab" data-tab="points"><b>5</b><span></span></button>
        <button class="tab" data-tab="notices"><b>6</b><span></span></button>
      </nav>
      <div id="side" class="side"></div>
      <footer id="footNote" class="foot"></footer>
    </aside>

    <section class="stage-wrap">
      <h1 id="printTitle" class="print-title"></h1>
      <div id="stage" class="stage">
        <div id="sizer" class="sizer"><div id="board" class="board"></div></div>
      </div>
      <div class="zoom">
        <button id="zoomOut" class="icon" aria-label="Zoom out">−</button>
        <span id="zoomVal">100%</span>
        <button id="zoomIn" class="icon" aria-label="Zoom in">+</button>
        <button id="zoomFit"></button>
      </div>
    </section>
  </main>

  <div id="offlineModal" class="mdo" hidden>
    <div class="mdc" role="dialog" aria-modal="true" aria-labelledby="offlineTitle">
      <div class="mdicon" aria-hidden="true">💻</div>
      <h3 id="offlineTitle"></h3>
      <p id="offlineMsg"></p>
      <ol id="offlineSteps"></ol>
      <div class="mdbtns">
        <a id="offlineDownload" class="mdbtn primary" href="https://github.com/MrWengKB/ClassManager/archive/refs/heads/main.zip" download>⬇ <span></span></a>
        <button id="offlineClose" class="mdbtn" type="button"></button>
      </div>
    </div>
  </div>

  <script src="js/i18n.js?v=20261124a"></script>
  <script src="js/points.js?v=20261122i"></script>
  <script src="js/reading.js?v=20261122i"></script>
  <script src="js/store.js?v=20261124a"></script>
  <script src="js/roster.js?v=20261122i"></script>
  <script src="js/seating.js?v=20261122i"></script>
  <script src="js/layout.js?v=20261122i"></script>
  <script src="js/studentdata.js?v=20261124a"></script>
  <script src="js/vendor/qrcode.js?v=1.4.4"></script>
  <script src="js/studentadmin.js?v=20261123b"></script>
  <script src="js/notices.js?v=20261124a"></script>
  <script src="js/noticeadmin.js?v=20261124a"></script>
  <script src="js/app.js?v=20261124a"></script>
  <script src="js/sheetio.js?v=20261122i"></script>
  <script src="js/cloud.js?v=20261123b"></script>
  <script src="js/sync.js?v=20261123b"></script>
  <script>
    // On a phone, suggest a computer or tablet; closing the notice keeps the full Manage page.
    (function () {
      if (!window.Mobile.on) return;
      try { if (sessionStorage.getItem('classmanager:mobileNote')) return; } catch (e) { /* ignore */ }
      const t = window.I18n.t;
      const wrap = document.createElement('div');
      wrap.className = 'mdo';
      wrap.innerHTML = '<div class="mdc"><div class="mdicon">💻</div><h3></h3><p></p><div class="mdbtns"><button class="mdbtn primary"></button><a class="mdbtn" href="index.html"></a></div></div>';
      wrap.querySelector('h3').textContent = t('mAdminTitle');
      wrap.querySelector('p').textContent = t('mAdminMsg');
      wrap.querySelector('button').textContent = t('mAdminGo');
      wrap.querySelector('a').textContent = t('viewLinkFull');
      const close = () => { wrap.remove(); try { sessionStorage.setItem('classmanager:mobileNote', '1'); } catch (e) { /* ignore */ } };
      wrap.querySelector('button').addEventListener('click', close);
      wrap.addEventListener('click', e => { if (e.target === wrap) close(); });
      document.body.appendChild(wrap);
    })();
  </script>
</body>
</html>
