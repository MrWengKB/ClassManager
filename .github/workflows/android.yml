name: Android app

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Caches Gradle downloads between runs (fewer requests to Maven Central).
      - uses: gradle/actions/setup-gradle@v4

      - name: Set up signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.CM_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "CM_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo "Release builds will be signed with the upload key."
          else
            echo "::warning::No CM_KEYSTORE_BASE64 secret: building a debug APK only."
          fi

      - name: Build
        working-directory: android
        env:
          CM_KEYSTORE_PASSWORD: ${{ secrets.CM_KEYSTORE_PASSWORD }}
          CM_KEY_ALIAS: ${{ secrets.CM_KEY_ALIAS }}
          CM_KEY_PASSWORD: ${{ secrets.CM_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ -n "$CM_KEYSTORE_FILE" ]; then
            ./gradlew --no-daemon bundleRelease assembleRelease
          else
            ./gradlew --no-daemon assembleDebug
          fi

      - name: Upload AAB (for Google Play)
        if: env.CM_KEYSTORE_FILE != ''
        uses: actions/upload-artifact@v4
        with:
          name: class-manager-aab
          path: android/app/build/outputs/bundle/release/*.aab

      - name: Upload APK (install on a phone to test)
        uses: actions/upload-artifact@v4
        with:
          name: class-manager-apk
          path: android/app/build/outputs/apk/**/*.apk

      # Publish the signed APK (and AAB) as a GitHub Release, so it can be downloaded
      # directly on a phone without unzipping. Only from main, only when signed.
      # Stable link: https://github.com/MrWengKB/ClassManager/releases/latest/download/ClassManager.apk
      - name: Prepare release files
        if: env.CM_KEYSTORE_FILE != '' && github.ref == 'refs/heads/main'
        run: |
          VERSION=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' android/app/build.gradle.kts)
          CODE=$(sed -n 's/.*versionCode = \([0-9]*\).*/\1/p' android/app/build.gradle.kts)
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "APP_CODE=$CODE" >> "$GITHUB_ENV"
          mkdir -p dist
          cp android/app/build/outputs/apk/release/*.apk dist/ClassManager.apk
          cp android/app/build/outputs/bundle/release/*.aab dist/ClassManager.aab

      - name: Publish GitHub Release
        if: env.CM_KEYSTORE_FILE != '' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ env.APP_VERSION }}
          target_commitish: ${{ github.sha }}
          name: Class Manager Android ${{ env.APP_VERSION }} (build ${{ env.APP_CODE }})
          body: |
            在安卓手机上下载 **ClassManager.apk** 直接安装（覆盖旧版即可）。
            Download **ClassManager.apk** on an Android phone and install it.

            `ClassManager.aab` 是上传 Google Play 用的。 / `ClassManager.aab` is for uploading to Google Play.

            Built from ${{ github.sha }}.
          files: |
            dist/ClassManager.apk
            dist/ClassManager.aab
          make_latest: true
