<!doctype html>
<html lang="zh-Hans">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-LVJJ4GY9FC"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-LVJJ4GY9FC');
  </script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Class Manager</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body class="page-scroll">
  <div class="wip-banner" role="alert">⚠施工中，请勿使用 Work in Progress. Do NOT use.</div>
  <header class="top">
    <a class="brand" href="index.html">
      <img class="logo" src="favicon.svg" alt="" width="32" height="32">
      <div><b id="brandName">Class Manager</b><small id="brandSub"></small></div>
    </a>
    <div class="tools">
      <select id="langSel" aria-label="Language">
        <option value="en">English</option>
        <option value="zh">中文</option>
        <option value="ms">Bahasa Melayu</option>
        <option value="ta">தமிழ்</option>
      </select>
    </div>
  </header>

  <main class="auth-main">
    <form id="authForm" class="auth-card" novalidate>
      <h2 id="authTitle"></h2>
      <label class="field"><span id="lblName"></span>
        <input id="accName" name="username" autocomplete="username" maxlength="40" required>
      </label>
      <label class="field"><span id="lblPw"></span>
        <input id="accPw" name="password" type="password" maxlength="200" required>
        <small id="pwHint" class="hint"></small>
      </label>
      <label class="field" id="confirmRow"><span id="lblConfirm"></span>
        <input id="accConfirm" name="confirm" type="password" autocomplete="new-password" maxlength="200">
      </label>
      <div id="authMsg" class="msg warn" role="alert" hidden></div>
      <button id="authSubmit" class="primary wide" type="submit"></button>
      <button id="authSwitch" class="link" type="button"></button>
      <p id="authNote" class="hint small"></p>
    </form>
  </main>

  <script src="js/i18n.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
