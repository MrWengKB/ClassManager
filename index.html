<!doctype html>
<html lang="zh-Hans">
<head>
  <!-- Google tag (gtag.js) -->

  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Class Manager</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body class="view-page">
  <header class="top">
    <div class="brand">
      <img class="logo" src="favicon.svg" alt="" width="32" height="32">
      <div><b id="brandName">Class Manager</b><small id="brandSub"></small></div>
    </div>
    <h1 id="classTitle" class="class-title view-title"></h1>
    <select id="classSel" class="cloud-only" aria-label="Class" hidden></select>
    <div class="tools">
      <button id="btnPrint"><span></span></button>
      <select id="langSel" aria-label="Language">
        <option value="en">English</option>
        <option value="zh">中文</option>
        <option value="ms">Bahasa Melayu</option>
        <option value="ta">தமிழ்</option>
      </select>
      <a id="lnkReading" class="navbtn" href="readlog.html">📚 <span></span></a>
      <a id="lnkAdmin" class="navbtn primary" href="admin.html">⚙ <span></span></a>
    </div>
  </header>

  <main>
    <aside class="panel">
      <div id="side" class="side"></div>
      <footer class="foot"><a href="privacy.html">Privacy Policy · 隐私政策</a></footer>
    </aside>

    <section id="mobileMain" class="mobile-main"></section>

    <section class="stage-wrap">
      <h1 id="printTitle" class="print-title"></h1>
      <div id="stage" class="stage">
        <div id="sizer" class="sizer"><div id="board" class="board"></div></div>
      </div>
      <div id="award" class="award" role="dialog" hidden></div>
      <div id="emptyNote" class="empty-note" hidden><b></b><p></p><a id="emptySignIn" class="navbtn primary" href="login.html?next=index.html" hidden></a></div>
      <div class="zoom">
        <button id="zoomOut" class="icon" aria-label="Zoom out">−</button>
        <span id="zoomVal">100%</span>
        <button id="zoomIn" class="icon" aria-label="Zoom in">+</button>
        <button id="zoomFit"></button>
      </div>
    </section>
  </main>

  <script src="js/mobile.js"></script>
  <script src="js/config.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cloud.js"></script>
  <script src="js/points.js"></script>
  <script src="js/reading.js"></script>
  <script src="js/store.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/live.js"></script>
  <script src="js/classtools.js"></script>
  <script src="js/view.js"></script>
</body>
</html>
